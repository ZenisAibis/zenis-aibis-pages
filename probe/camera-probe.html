<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カメラの一覧（試し）</title>
<style>
  :root{--bg:#f6f7f9;--fg:#1f2933;--muted:#5f6b7a;--line:#d5dae1;--accent:#2563a8}
  @media (prefers-color-scheme: dark){:root{--bg:#14181d;--fg:#e6e9ee;--muted:#9aa5b3;--line:#2c333c;--accent:#7fb0e6;color-scheme:dark}}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif;padding:16px}
  h1{font-size:18px;margin:0 0 8px}
  p{margin:0 0 12px;color:var(--muted)}
  button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff}
  button.sub{background:transparent;color:var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  video{width:100%;max-width:480px;background:#000;border-radius:8px}
  pre{white-space:pre-wrap;word-break:break-all;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px}
</style>
</head>
<body>
<h1>背面カメラの一覧（アイビスカメラの超広角の下調べ）</h1>
<p>読むだけの試しです。写真は撮らず、どこにも送りません。①「調べる」を押してカメラを許可 → ②一覧が出たら「次のカメラ」で1つずつ映像を見て、超広角（広く写るもの）が何番目かを確かめてください。最後に下の文字を全部コピーして送ってください。</p>
<div class="row">
  <button id="go">① 調べる</button>
  <button id="next" class="sub" disabled>② 次のカメラ</button>
  <button id="copy" class="sub" disabled>③ 結果をコピー</button>
</div>
<video id="v" playsinline muted autoplay></video>
<pre id="out">まだ調べていません。</pre>
<script>
(function(){
  var out=document.getElementById('out'), v=document.getElementById('v');
  var lines=[], cams=[], idx=-1, stream=null;
  function log(s){ lines.push(s); out.textContent=lines.join('\n'); }
  function stop(){ if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } }
  function describe(track){
    var caps=track.getCapabilities?track.getCapabilities():{}, st=track.getSettings?track.getSettings():{};
    return '  設定: '+(st.width||'?')+'x'+(st.height||'?')+' facingMode='+(st.facingMode||'?')
      +'\n  ズーム: '+(caps.zoom?(caps.zoom.min+'〜'+caps.zoom.max+'（今 '+(st.zoom!=null?st.zoom:'?')+'）'):'なし')
      +' ライト: '+(caps.torch?'あり':'なし')
      +' ピント: '+((caps.focusMode||[]).join('/')||'なし')
      +'\n  最大解像度: '+(caps.width?caps.width.max:'?')+'x'+(caps.height?caps.height.max:'?');
  }
  async function open(deviceId,label){
    stop();
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:deviceId?{deviceId:{exact:deviceId}}:{facingMode:{ideal:'environment'}}});
      v.srcObject=stream; await v.play().catch(function(){});
      log((label||'既定の背面')+'\n'+describe(stream.getVideoTracks()[0]));
    }catch(e){ log((label||'既定の背面')+'\n  開けませんでした: '+(e&&e.name)+' '+(e&&e.message)); }
  }
  document.getElementById('go').addEventListener('click', async function(){
    lines=[]; log('UA: '+navigator.userAgent);
    if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices){ log('このブラウザでは調べられません'); return; }
    await open('', '【既定の背面（アイビスカメラと同じ開き方）】');
    var devs=await navigator.mediaDevices.enumerateDevices();
    cams=devs.filter(function(d){return d.kind==='videoinput';});
    log('\nカメラの数: '+cams.length);
    cams.forEach(function(d,i){ log('  '+(i+1)+': '+(d.label||'(名前なし)')+' / id '+String(d.deviceId).slice(0,8)); });
    idx=-1; document.getElementById('next').disabled=!cams.length; document.getElementById('copy').disabled=false;
  });
  document.getElementById('next').addEventListener('click', function(){
    if(!cams.length) return; idx=(idx+1)%cams.length;
    log(''); open(cams[idx].deviceId, '【カメラ '+(idx+1)+'/'+cams.length+'】'+(cams[idx].label||'(名前なし)'));
  });
  document.getElementById('copy').addEventListener('click', function(){
    var t=lines.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ alert('コピーしました'); },function(){ selectOut(); }); } else selectOut();
  });
  function selectOut(){ var r=document.createRange(); r.selectNodeContents(out); var s=getSelection(); s.removeAllRanges(); s.addRange(r); }
})();
</script>
</body>
</html>
